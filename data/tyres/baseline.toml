# Baseline tyres: the same values as Tyre::default() (docs/03).
format_version = 1

# Peak static friction, limits traction and braking per axle
mu_static = 0.9

# Placeholders pending a sourced value. mu_breakaway sits just above mu_rolling:
# the old 0.7 gave 5600 N of breakaway resistance against 3600 N of traction,
# so the car could never launch from rest.
mu_rolling = 0.03
mu_breakaway = 0.035

wheel_radius_m = 0.36
