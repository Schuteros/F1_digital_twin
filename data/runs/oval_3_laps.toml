# Three laps of the test oval (docs/15 section 15.9) with the baseline car.
# The car brakes before each corner, as late as it can, to arrive at the corner speed (docs/17),
# with the braking points checked by trial runs of the full simulation (docs/18).
# Start it with: cargo run -- data/runs/oval_3_laps.toml
format_version = 1

# Paths are relative to this file's folder
car = "../cars/baseline.toml"
# Optional: without it, the car's default_tyres is used
tyres = "../tyres/baseline.toml"
track = "../tracks/oval_244m.csv"
environment = "../environments/standard.toml"

start_time_s = 0.0
# When the run ends: { time_s = ... } or { laps = ..., max_time_s = ... } (docs/15 section 15.8).
# It also ends when the car has braked to a stop.
end_condition = { laps = 3, max_time_s = 600.0 }
# Length the track curvature is averaged over, 0 = no smoothing (docs/15 section 15.5).
# The oval points are exact, so it needs none. Measured track points need a few meters.
curvature_smoothing_window_m = 0.0
# Must satisfy the suspension stability limit omega_max * time_step < 2 (docs/11 section 11.8)
time_step_s = 0.001

# How the driver plans the lap (docs/17). Optional, without it grip_margin = 0.0.
[driver]
# The driver plans corner speeds and braking points with both tyre friction coefficients
# (mu_x_ref, mu_y_ref) multiplied by (1 - grip_margin). The simulated tyres keep their full grip,
# so the difference is a reserve. 0.0 = plans exactly on the limit, 0.05 = 5 % less grip,
# about 2.5 % less corner speed. Must be 0.0 up to (not including) 1.0.
grip_margin = 0.05
# true = before the run, move each braking point earlier or later with trial runs of the full
# simulation until the car gets through the corner without going over the limit (docs/18).
# false or missing = the docs/17 plan as it is.
braking_point_trials = true

# Starting conditions of the car at start_time_s: on the start/finish line (distance 0),
# already rolling at 10 m/s, in 1st gear, not shifting.
# The engine speed, braking zone, braking flag and acceleration are not set here: they are
# calculated from these values and the car, track and environment before the run starts.
[initial_state]
speed_m_per_s = 10.0
distance_m = 0.0
gear = 1
# Time left of a gear shift in progress, 0.0 = not shifting
shift_time_left_s = 0.0

# Body motion measured from static equilibrium (docs/11). All 0.0 = at rest.
# Heave is positive down, pitch is positive nose down.
[initial_state.suspension]
heave_m = 0.0
heave_velocity_m_per_s = 0.0
pitch_rad = 0.0
pitch_rate_rad_per_s = 0.0
